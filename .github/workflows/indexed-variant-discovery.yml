name: Indexed Darija algorithm checks

on:
  push:
    branches: [feat/indexed-darija-variant-discovery]
  pull_request:
    branches: [feat/darija-benchmark-suite]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexed-darija-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: TypeScript checks
        run: npm run lint
      - name: Algorithm and benchmark tests
        run: npm test -- --reporter=verbose
      - name: Production build
        run: npm run build
