<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>إتمام المصادقة — Darija LexReview</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #050507;
        color: #f4f4f6;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        padding: 24px;
        text-align: center;
      }
      .card {
        max-width: 420px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: #0c0c10;
        border-radius: 16px;
        padding: 28px 24px;
      }
      .dot {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: #d9ff43;
        margin-bottom: 14px;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 8px;
        color: #ffffff;
      }
      p {
        font-size: 13px;
        color: #a1a1aa;
        margin: 0;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <span class="dot" aria-hidden="true"></span>
      <h1>تم التحقق من الحساب بنجاح</h1>
      <p>جارٍ نقل الجلسة إلى مساحة المراجعة وإغلاق هذه النافذة تلقائياً...</p>
    </div>
    <script>
      (function () {
        var rawHash = window.location.hash ? window.location.hash.substring(1) : '';
        var rawSearch = window.location.search ? window.location.search.substring(1) : '';
        if (window.opener && !window.opener.closed) {
          try {
            window.opener.postMessage(
              {
                type: 'OAUTH_AUTH_SUCCESS',
                hash: rawHash,
                search: rawSearch,
              },
              '*'
            );
          } catch (err) {
            console.error('postMessage failed:', err);
          }
          setTimeout(function () {
            window.close();
          }, 150);
        } else {
          var nextUrl =
            '/' +
            (rawSearch ? '?' + rawSearch : '') +
            (rawHash ? '#' + rawHash : '');
          window.location.replace(nextUrl);
        }
      })();
    </script>
  </body>
</html>
