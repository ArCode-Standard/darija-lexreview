name: Arabizi Engine

on:
  push:
    branches:
      - feat/arabizi-contextual-nbest-engine
  pull_request:
    branches:
      - feat/indexed-darija-variant-discovery
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arabizi-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: TypeScript checks
        run: npm run lint
      - name: Unit and benchmark tests
        run: npm test -- --reporter=verbose
      - name: Production build
        run: npm run build
