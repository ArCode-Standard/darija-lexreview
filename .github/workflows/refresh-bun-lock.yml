name: Refresh Bun lockfile

on:
  push:
    branches:
      - qa/cloud-supabase-integration
    paths:
      - .github/workflows/refresh-bun-lock.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/cloud-supabase-integration
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: oven-sh/setup-bun@v2
      - name: Regenerate lockfile from package.json
        run: bun install --lockfile-only
      - name: Commit lockfile when changed
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock is already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore: synchronize Bun lockfile"
          git push origin HEAD:qa/cloud-supabase-integration
